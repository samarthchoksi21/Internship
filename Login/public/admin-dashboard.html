<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRON-GEAR | Admin Command Center</title>
    <link rel="stylesheet" href="admin-dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-top">
                <div class="logo">IRON<span>GEAR</span></div>
                <div class="admin-profile">
                    <div class="avatar" id="avatar-init">A</div>
                    <div class="admin-info">
                        <p id="admin-name">Admin Name</p>
                        <span>Verified Admin</span>
                    </div>
                </div>
            </div>
            <nav class="side-nav">
                <button class="nav-link active" onclick="renderHome()"><i class="fa-solid fa-house"></i> Home Dashboard</button>
                <button class="nav-link" onclick="window.location.href='index.html'"><i class="fa-solid fa-store"></i> View Storefront</button>
                <button class="nav-link logout-btn"><i class="fa-solid fa-power-off"></i> Logout</button>
            </nav>
        </aside>

        <main class="workspace">
            <header class="workspace-header">
                <div class="header-text">
                    <h1 id="view-title">Command Center</h1>
                    <p id="view-subtitle">System Overview & Quick Actions</p>
                </div>
                <div id="header-actions"></div>
            </header>

            <div id="dynamic-content" class="content-area">
                </div>
        </main>
    </div>

    <script src="admin-dashboard.js"></script>
</body>
</html>
