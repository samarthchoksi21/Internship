<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRON-GEAR | Premium Gym Store</title>
    <link rel="stylesheet" href="/css/webpage.css">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <nav class="navbar">
        <div class="logo">IRON<span>GEAR</span></div>
        <div class="nav-right" style="display: flex; align-items: center; gap: 20px;">
            <div class="cart-trigger" onclick="toggleCart()">
                <i class="fa-solid fa-bag-shopping"></i>
                <span id="cart-count">0</span>
            </div>

            <div class="user-menu-container" style="position: relative;">
                <div class="profile-trigger" onclick="toggleProfileMenu()"
                    style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                    <span id="user-display-name" style="font-weight: 600; font-size: 14px; color: #333;">...</span>
                    <div class="avatar-circle"
                        style="width: 35px; height: 35px; background: #222; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white;">
                        <i class="fa-solid fa-user" style="font-size: 14px;"></i>
                    </div>
                </div>

                <div id="profile-dropdown" class="dropdown-menu"
                    style="display: none; position: absolute; right: 0; top: 45px; background: white; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 180px; z-index: 1001; border: 1px solid #eee; overflow: hidden;">
                    <button onclick="showUserInfo()"
                        style="width: 100%; padding: 12px 15px; text-align: left; border: none; background: none; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 10px;">
                        <i class="fa-solid fa-circle-user"></i> My Profile
                    </button>
                    <button onclick="handleLogout()"
                        style="width: 100%; padding: 12px 15px; text-align: left; border: none; background: none; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 10px; color: #ff4d4d; border-top: 1px solid #eee;">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <section class="search-area">
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="productSearch" placeholder="Search supplements, gear, dumbells..."
                onkeyup="searchProducts()">
        </div>
        <div class="category-pills" id="category-list">
            <button class="cat-pill active" onclick="filterCategory('all')">All Gear</button>
            <button class="cat-pill" onclick="filterCategory('PRTOEIN')">Proteins</button>
            <button class="cat-pill" onclick="filterCategory('Dumbell')">Dumbells</button>
            <button class="cat-pill" onclick="filterCategory('Accessories')">Accessories</button>
            <button class="cat-pill" onclick="filterCategory('MACHINES')">Machines</button>
        </div>
    </section>

    <main class="container">
        <div id="product-grid" class="product-grid">
        </div>
    </main>

    <div id="cart-popup" class="cart-popup-card">
        <div class="popup-content">
            <div class="success-icon"><i class="fa-solid fa-check"></i></div>
            <div class="popup-info">
                <p class="popup-status">Added to Bag</p>
                <h4 id="pop-item-name">Product Name</h4>
                <div class="pop-footer">
                    <span id="pop-total">Total: ₹0</span>
                    <button class="btn-pop-checkout" onclick="toggleCart()">View Bag</button>
                </div>
            </div>
            <i class="fa-solid fa-xmark close-pop" onclick="hidePopup()"></i>
        </div>
    </div>

    <div id="cart-drawer" class="cart-drawer">
        <div class="cart-header">
            <h3>Your Training Bag</h3>
            <i class="fa-solid fa-xmark" style="cursor:pointer" onclick="toggleCart()"></i>
        </div>

        <div id="cart-items" class="cart-items-list"></div>

        <div class="coupon-wrapper" style="padding: 15px; border-top: 1px solid #eee;">
            <div style="display: flex; gap: 8px;">
                <input type="text" id="coupon-code" placeholder="Enter Coupon"
                    style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; outline: none;">
                <button id="apply-coupon-btn" onclick="handleCoupon()"
                    style="background: #222; color: #fff; border: none; padding: 0 15px; border-radius: 6px; cursor: pointer; font-weight: 600;">
                    APPLY
                </button>
            </div>
            <p id="coupon-status" style="font-size: 12px; margin-top: 8px; display: none;"></p>
        </div>

        <div class="cart-footer">
            <div class="total-row">
                <span>Total Amount:</span>
                <span id="cart-total" style="font-weight: 800; color: var(--primary);">₹0</span>
            </div>
            <button class="btn-checkout" id="checkout-main-btn" onclick="initiateCheckout()">Proceed to
                Checkout</button>
        </div>
    </div>
    <div id="overlay" class="overlay" onclick="toggleCart()"></div>
    <div id="user-modal" class="cart-drawer" style="right: -400px; transition: 0.4s ease;">
        <div class="cart-header">
            <h3>Member Profile</h3>
            <i class="fa-solid fa-xmark" style="cursor:pointer" onclick="closeUserModal()"></i>
        </div>
        <div style="padding: 30px; text-align: center;">
            <div
                style="width: 80px; height: 80px; background: #f3f4f6; border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 30px; color: #222;">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h2 id="modal-username" style="margin-bottom: 5px;">Username</h2>
            <p id="modal-email" style="color: #666; margin-bottom: 20px;">email@example.com</p>

            <div style="text-align: left; background: #f9fafb; padding: 15px; border-radius: 10px; font-size: 14px;">
                <p style="margin-bottom: 10px;"><strong>Status:</strong> <span style="color: #22c55e;">Active
                        Warrior</span></p>
                <p><strong>Role:</strong> <span id="modal-role">User</span></p>
            </div>
        </div>
    </div>

    <script src="/js/WebPage.js"></script>
</body>

</html>
