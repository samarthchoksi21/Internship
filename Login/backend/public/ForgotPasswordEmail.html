<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Password | Store</title>
  <link rel="stylesheet" href="ChangePassword.css" />
</head>
<body>
  <div class="shop-auth-wrapper">
    <div class="shop-auth-card">

      <div class="shop-brand">
        <h1>IRON GEAR</h1>
        <p>Secure your account by updating your password.</p>
      </div>

      <form class="login-form shop-form" id="ForgotPasswordPage">
        <h2>Forgot Password</h2>
        <div class="content">

          <div class="field">
            <label>Email</label>
            <input type="email" id="email" />
            <small class="error" id="emailError"></small>
          </div>
          <button type="submit" class="shop-btn">Send OTP</button>

          <p id="errorMsg" class="error" style="text-align:center;"></p>
          <p id="successMsg" style="color: green; text-align:center;"></p>

          <p class="redirect">
            <a href="login.html">Back to Login</a>
          </p>
        </div>
      </form>

    </div>
  </div>

  <script src="ForgotPasswordEmail.js"></script>
</body>
</html>
