<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Store</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- NEW wrapper (safe, backend unaffected) -->
  <div class="shop-auth-wrapper">
    <div class="shop-auth-card">

      <!-- LEFT BRAND PANEL -->
      <div class="shop-brand">
        <h1>IRON GEAR</h1>
        <p>Welcome back. Login to continue shopping.</p>
      </div>

      <!-- LOGIN FORM -->
      <form class="login-form shop-form" id="loginform">
        <h2>Login</h2>

        <div class="content">

          <div class="field">
            <label>Email</label>
            <input type="email" id="email" />
            <small class="error" id="emailError"></small>
          </div>

          <div class="field">
            <label>Password</label>
            <input type="password" id="password" />
            <small class="error" id="passwordError"></small>
          </div>

          <button type="submit" class="shop-btn" id="loginBtn">
            <span class="btn-text">Login</span>
            <span class="btn-loader hidden">
              <span></span>
              <span></span>
              <span></span>
            </span>
          </button>
          <label class="remember">
            <input type="checkbox" checked />
            Remember me
          </label>

          <p class="redirect">   
            Don’t have an account?
            <a href="/index.html">Signup</a>
          </p>

          <p class="redirect">
            <a href="/ForgotPasswordEmail.html">Forgot Password</a>
          </p>

        </div>
      </form>

    </div>
  </div>
  <script src="js/login.js"></script>
</body>

</html>
